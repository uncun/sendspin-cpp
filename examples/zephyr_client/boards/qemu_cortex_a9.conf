# Build demonstration only: the loopback interface has no external Sendspin server.
# These random generators are insecure and must never be used in a product.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TEST_CSPRNG_GENERATOR=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_QEMU_SLIP=y
CONFIG_NET_SLIP_TAP=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_MIN_REQUIRED_HEAP_SIZE=262144
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
