tests:
  sendspin.zephyr:
    tags:
      - sendspin
      - net
    platform_allow:
      - qemu_cortex_a9
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
  sendspin.zephyr.static_stacks:
    tags: [sendspin, net]
    platform_allow: [native_sim/native/64]
    integration_platforms: [native_sim/native/64]
    extra_configs:
      - CONFIG_SENDSPIN_STATIC_THREAD_STACKS=y
      - CONFIG_SENDSPIN_THREAD_STACK_SIZE=12288
      - CONFIG_SENDSPIN_THREAD_COUNT=4
      - CONFIG_HEAP_MEM_POOL_SIZE=51000
